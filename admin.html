<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Panel · Lau Nails</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4eefb;color:#241a30;font:16px/1.5 "Helvetica Neue",Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
#app{max-width:720px;margin:0 auto}.card{background:#fff;border:1px solid #e8def5;border-radius:20px;padding:22px;margin:0 0 16px}
h1{font-size:1.5rem;margin:0 0 6px}h2{font-size:1.05rem;margin:0 0 12px}.m{color:#7c6e8c;margin:0 0 14px}
input{width:100%;padding:13px;border:1px solid #e8def5;border-radius:12px;font:inherit;margin:0 0 10px}
button,.b{background:#7c3aed;color:#fff;border:0;padding:11px 18px;border-radius:999px;font:600 .9rem inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:#efe6fb;color:#4c1d95}button.r{background:#fde8e8;color:#b42318}
.code{font:700 2rem/1.2 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-align:center;background:#f4eefb;border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #f0e8fb;flex-wrap:wrap}
.row small{color:#7c6e8c;display:block}.acts{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:.75rem;padding:3px 10px;border-radius:99px;background:#efe6fb;color:#4c1d95}
.tag.off{background:#fde8e8;color:#b42318}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
</style></head><body><div id="app"><div class="card"><p class="m">Cargando…</p></div></div>
<script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
